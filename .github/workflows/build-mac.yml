name: Build macOS App

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
      
      - name: Build macOS app
        run: |
          pyinstaller --onefile --windowed --name REMP REMP_1_2.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: REMP-macOS-arm64
          path: dist/REMP.app
          retention-days: 30
